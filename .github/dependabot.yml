version: 2
updates:
  # Libraries and plugins from gradle/libs.versions.toml and the Gradle wrapper. After an update the CI checks that
  # app/gradle.lockfile matches; if not, run ./gradlew :app:dependencies --write-locks on the Dependabot branch.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Android Gradle Plugin ships its own Kotlin (AGP 9.5: Kotlin 2.2.10); the Compose compiler plugin must use
      # exactly that version, a newer one breaks the build. It moves together with AGP updates, not on its own.
      - dependency-name: org.jetbrains.kotlin.plugin.compose
    groups:
      androidx:
        patterns: ['androidx.*']
        update-types: [minor, patch]
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
