name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that new queries and newly published vulnerability patterns also hit unchanged code.
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    defaults:
      run:
        working-directory: bike-maintainer-app
    steps:
      # The API client is generated from ../bike-maintainer-api's spec, so both repos are checked out side by side.
      - name: Check out app
        uses: actions/checkout@v7
        with:
          path: bike-maintainer-app

      # The branch with the same name if it exists (PRs that depend on an open API PR), else main.
      - name: Select API branch
        id: api-branch
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/stargazer74/bike-maintainer-api.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out API spec (${{ steps.api-branch.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: stargazer74/bike-maintainer-api
          ref: ${{ steps.api-branch.outputs.ref }}
          path: bike-maintainer-api

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
          # Two Java quality rules only flag what the Kotlin compiler generates (#26): the casts in the equals() of a
          # `data object` ("tmp0_other_with_cast is never read") and Compose's `$stable` fields in generated code.
          # Unused variables are already reported by the Kotlin compiler, and Kotlin has no field hiding (`override`).
          config: |
            query-filters:
              - exclude:
                  id: java/local-variable-is-never-read
              - exclude:
                  id: java/field-masks-super-field

      # Only the code compiled after init is analysed; --no-build-cache and --rerun-tasks make sure Kotlin really
      # compiles instead of restoring outputs from the cache.
      - name: Compile
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
