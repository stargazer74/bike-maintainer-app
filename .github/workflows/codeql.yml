name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that new queries and newly published vulnerability patterns also hit unchanged code.
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out app
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # Only the code compiled after init is analysed; --no-build-cache and --rerun-tasks make sure Kotlin really
      # compiles instead of restoring outputs from the cache.
      - name: Compile
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
